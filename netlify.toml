[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next,.next/**"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL,SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_STORAGE_BUCKET,CMS_STORAGE_PROVIDER,ADMIN_PASSWORD,ADMIN_USERNAME,ADMIN_SESSION_SECRET,STUDIO_SESSION_SECRET,DATABASE_URL"
  CMS_STORAGE_PROVIDER = "supabase"
  NEXT_PUBLIC_SITE_URL = "https://creativexcreations.netlify.app"
  SUPABASE_URL = "https://ejhonioesosayoobeoui.supabase.co"

[context.production.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next,.next/**"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL,SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_STORAGE_BUCKET,CMS_STORAGE_PROVIDER,ADMIN_PASSWORD,ADMIN_USERNAME,ADMIN_SESSION_SECRET,STUDIO_SESSION_SECRET,DATABASE_URL"

[context.deploy-preview.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next,.next/**"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL,SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_STORAGE_BUCKET,CMS_STORAGE_PROVIDER,ADMIN_PASSWORD,ADMIN_USERNAME,ADMIN_SESSION_SECRET,STUDIO_SESSION_SECRET,DATABASE_URL"

[context.branch-deploy.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next,.next/**"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL,SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_STORAGE_BUCKET,CMS_STORAGE_PROVIDER,ADMIN_PASSWORD,ADMIN_USERNAME,ADMIN_SESSION_SECRET,STUDIO_SESSION_SECRET,DATABASE_URL"
